camera-extensions = { group = "androidx.camera", name = "camera-extensions", version.ref = "cameraExtensions" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "compiler" }
ucrop = { group = "com.github.yalantis", name = "ucrop", version.ref = "ucrop" }
segmentation-selfie = { group = "com.google.mlkit", name = "segmentation-selfie", version.ref = "segmentationSelfie" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

