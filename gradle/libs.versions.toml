[versions]
agp = "8.13.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
firebaseDatabase = "22.0.1"
navigationFragment = "2.9.5"
navigationUi = "2.9.5"
roomRuntime = "2.6.1"
roomGuava = "2.6.1"
roomCompiler = "2.6.1"
cameraCamera2 = "1.5.1"
cameraLifecycle = "1.5.1"
cameraView = "1.5.1"
cameraExtensions = "1.5.1"
annotation = "1.9.1"
glide = "4.16.0"
compiler = "4.16.0"
ucrop = "2.2.11"
